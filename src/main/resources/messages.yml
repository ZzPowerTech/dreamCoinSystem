# dreamCoinSystem — mensagens (formato MiniMessage: https://docs.advntr.dev/minimessage/format)
# Deixe uma mensagem vazia ("") para desligá-la.

prefix: "<dark_gray>[<gold>Dream</gold>]</dark_gray> "

# Como cada moeda é escrita. symbol é usado na forma curta (10o 20p 3b).
coins:
  gold:
    singular: ouro
    plural: ouro
    symbol: o
  silver:
    singular: prata
    plural: prata
    symbol: p
  bronze:
    singular: bronze
    plural: bronze
    symbol: b

# "1 ouro, 2 prata e 3 bronze"
format:
  separator: ", "
  last-separator: " e "
  thousands-separator: "."

balance:
  self: "<gray>Seu saldo: <yellow><balance></yellow>"
  other: "<gray>Saldo de <white><player></white>: <yellow><balance></yellow>"

usage:
  saldo: "<gray>Uso: <white>/saldo [jogador]"

errors:
  no-permission: "<red>Você não tem permissão para isso."
  unknown-player: "<red>Jogador <white><player></white> não encontrado."
  account-loading: "<red>Sua conta ainda está carregando. Tente de novo em instantes."
  database: "<red>Erro ao consultar o banco de dados. Avise a staff."
  account-load-failed: "<red>Não foi possível carregar sua conta de moedas. Tente entrar de novo."
