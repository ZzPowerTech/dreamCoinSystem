name: dreamCoinSystem
version: '${project.version}'
main: dev.austv.dreamcoins.DreamCoins
api-version: '1.21'
description: Economia de três moedas (ouro, prata, bronze) do servidor Dream.
authors: [ZzPowerTech]
website: https://github.com/ZzPowerTech/dreamCoinSystem

# Nunca registrar /pay, /balance nem /eco: colidem com o Essentials.
commands:
  saldo:
    description: Mostra o seu saldo ou o de outro jogador.
    usage: /saldo [jogador]
  moedas:
    description: Administração das moedas (dar, tirar, definir, recarregar).
    usage: /moedas <give|take|set> <jogador> <quantia> | /moedas reload
    aliases: [dreamcoins]
  pagar:
    description: Paga outro jogador em ouro, prata e bronze.
    usage: /pagar <jogador> <quantia> | /pagar confirmar

permissions:
  dreamcoins.balance:
    description: Ver o próprio saldo.
    default: true
  dreamcoins.balance.others:
    description: Ver o saldo de outros jogadores.
    default: op
  dreamcoins.admin:
    description: /moedas give, take, set e reload.
    default: op
  dreamcoins.pay:
    description: Pagar outros jogadores com /pagar.
    default: true
  dreamcoins.bypass.cooldown:
    description: Sem intervalo mínimo entre pagamentos.
    default: op
  dreamcoins.bypass.confirm:
    description: Pagamentos altos sem /pagar confirmar.
    default: op
