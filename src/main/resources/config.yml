# dreamCoinSystem — configuração
#
# Quantias são escritas como no jogo: "1 ouro 2 prata 3 bronze" (ou "0").
# 1 ouro = 1000 prata = 100.000 bronze. 1 prata = 100 bronze.
# Para o Vault (lojas, leilões), 1.00 = 1 prata e 0.01 = 1 bronze.

storage:
  # sqlite: servidor único (arquivo na pasta do plugin).
  # mysql: vários servidores dividindo o mesmo saldo.
  type: sqlite
  sqlite:
    file: dreamcoins.db
  mysql:
    host: localhost
    port: 3306
    database: dreamcoins
    username: dreamcoins
    password: ""
    pool-size: 5
    # true exige SSL (sslMode=REQUIRED); false é o normal para banco na rede local.
    use-ssl: false

accounts:
  # Saldo de quem entra pela primeira vez.
  starting-balance: "0"
  # Ninguém passa deste saldo. "0" = teto absoluto (9999999999 ouro, o maior que o Vault
  # representa sem erro de arredondamento).
  max-balance: "9999999999 ouro"
  # A cada quantos segundos o que mudou é gravado no banco (também grava ao sair).
  flush-interval-seconds: 10
  # Só MySQL: a cada quantos segundos o saldo dos online é relido do banco,
  # para mostrar o que outro servidor gravou.
  resync-interval-seconds: 30

vault:
  # Quanto a main thread espera o banco numa operação do Vault com jogador OFFLINE (online é
  # instantâneo, vem do cache). Passou disso, o Vault recebe falha e o console avisa.
  offline-timeout-millis: 5000

# Proteções do /pagar.
payments:
  # Menor pagamento aceito.
  min-amount: "1 bronze"
  # Maior pagamento aceito; "0" = sem limite.
  max-amount: "0"
  # Intervalo mínimo entre dois pagamentos do mesmo jogador (bypass: dreamcoins.bypass.cooldown).
  cooldown-seconds: 3
  # Acima disto o jogador precisa digitar /pagar confirmar (bypass: dreamcoins.bypass.confirm).
  # "0" = nunca pede confirmação.
  confirm-above: "10 ouro"
  confirm-timeout-seconds: 30
  # Permite pagar quem está offline (desde que já tenha entrado alguma vez no servidor).
  allow-offline: true
