# dreamCoinSystem — mensagens (formato MiniMessage: https://docs.advntr.dev/minimessage/format)
# Deixe uma mensagem vazia ("") para desligá-la.

prefix: "<dark_gray>[<gold>Dream</gold>]</dark_gray> "

# Como cada moeda é escrita. symbol é usado na forma curta (10o 20p 3b).
coins:
  gold:
    singular: ouro
    plural: ouro
    symbol: o
  silver:
    singular: prata
    plural: prata
    symbol: p
  bronze:
    singular: bronze
    plural: bronze
    symbol: b

# "1 ouro, 2 prata e 3 bronze"
format:
  separator: ", "
  last-separator: " e "
  thousands-separator: "."

balance:
  self: "<gray>Seu saldo: <yellow><balance></yellow>"
  other: "<gray>Saldo de <white><player></white>: <yellow><balance></yellow>"

usage:
  saldo: "<gray>Uso: <white>/saldo [jogador]"

errors:
  no-permission: "<red>Você não tem permissão para isso."
  unknown-player: "<red>Jogador <white><player></white> não encontrado."
  account-loading: "<red>Sua conta ainda está carregando. Tente de novo em instantes."
  database: "<red>Erro ao consultar o banco de dados. Avise a staff."
  account-load-failed: "<red>Não foi possível carregar sua conta de moedas. Tente entrar de novo."

# Erros ao ler uma quantia (/moedas e /pagar). <token> é o trecho com problema.
amount-errors:
  empty: "<red>Informe uma quantia, ex.: <white>1 ouro 2 prata 3 bronze</white>."
  not-a-number: "<red><white><token></white> não é um número."
  not-positive: "<red>A quantia precisa ser maior que zero."
  not-integer: "<red>Use números inteiros: <white><token></white> não vale."
  missing-coin: "<red>Faltou a moeda depois de <white><token></white> (ouro, prata ou bronze)."
  unknown-coin: "<red>Moeda desconhecida: <white><token></white>. Use ouro, prata ou bronze."
  duplicate-coin: "<red>A moeda <white><token></white> apareceu duas vezes."
  overflow: "<red>Quantia grande demais."

admin:
  usage: "<gray>Uso: <white>/moedas <give|take|set> <jogador> <quantia></white> ou <white>/moedas reload</white>"
  give: "<green>Adicionado <white><amount></white> a <white><player></white>. Saldo: <yellow><balance></yellow>"
  take: "<green>Removido <white><amount></white> de <white><player></white>. Saldo: <yellow><balance></yellow>"
  set: "<green>Saldo de <white><player></white> definido em <yellow><balance></yellow>."
  set-drift: "<yellow>O saldo de <white><player></white> pode ter mudado durante a operação: agora é <white><balance></white> (pedido: <amount>). Confira."
  insufficient: "<red><white><player></white> tem só <white><balance></white>."
  exceeds-max: "<red>Passaria do saldo máximo (<white><max></white>)."
  busy: "<red>A conta de <white><player></white> tem uma retirada em andamento. Tente de novo em instantes."
  reloaded: "<green>Configuração e mensagens recarregadas."
  reload-restart: "<yellow>Mudanças em <white>storage</white> ou nos intervalos só valem depois de reiniciar o servidor."

# Avisos ao jogador quando a staff mexe no saldo dele. Deixe "" para desligar.
notify:
  given: "<gray>Você recebeu <yellow><amount></yellow> da staff."
  taken: "<gray>A staff removeu <yellow><amount></yellow> do seu saldo."
  set: "<gray>A staff definiu seu saldo em <yellow><balance></yellow>."

# Texto puro (sem cor) usado pelas placeholders %dreamcoins_*%.
placeholders:
  # %dreamcoins_highest% quando o jogador não tem moeda nenhuma.
  no-coin: "nenhuma"
